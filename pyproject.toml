[project]
name = "mplads"
version = "0.1.0"
description = "MPLADS (Member of Parliament Local Area Development Scheme) data pipeline and analytics"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Gaurav Sood" }]
keywords = ["mplads", "india", "parliament", "mp", "government", "spending", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "pydoclint>=0.5",
    "types-requests>=2.31",
    "types-tqdm>=4.66",
    "pandas-stubs>=2.0",
]

[project.urls]
Homepage = "https://github.com/soodoku/mplads"
Repository = "https://github.com/soodoku/mplads"
Issues = "https://github.com/soodoku/mplads/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
strict = true
ignore_missing_imports = true

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
